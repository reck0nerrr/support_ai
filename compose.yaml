services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:${POSTGRES_PASSWORD:-copilot}@db:5432/copilot
    command: [alembic, upgrade, head]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:${POSTGRES_PASSWORD:-copilot}@db:5432/copilot
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:${POSTGRES_PASSWORD:-copilot}@db:5432/copilot
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  bot:
    build: ./backend
    profiles: [telegram]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:${POSTGRES_PASSWORD:-copilot}@db:5432/copilot
    command: [python, -m, app.polling]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
